<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sprawdzanie Biletów</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: sans-serif; background: #f9f9f9; padding: 20px; }
    h1 { text-align: center; }
    input, button { padding: 10px; margin: 5px 0; width: 100%; font-size: 1em; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    tr.checked { background-color: #c8e6c9; }
  </style>
</head>
<body>
  <h1>Sprawdzanie Biletów</h1>

  <!-- Wprowadzenie numerycznego kodu biletu lub numeru rzędu z miejscem -->
  <input type="text" id="codeInput" placeholder="Kod biletu lub Rząd-Miejsce (np. A-18)" />
  <button onclick="checkIn()">Zaznacz jako obecny</button>

  <table>
    <thead>
      <tr>
        <th>Kod Biletu</th>
        <th>Miejsce</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="attendeeList">
      <tr data-code="7778886661" data-row="A" data-seat="18"><td>7778886661</td><td>Rząd A, Miejsce 18</td><td class="status">Nieobecny</td></tr>
      <tr data-code="7778886662" data-row="B" data-seat="5"><td>7778886662</td><td>Rząd B, Miejsce 5</td><td class="status">Nieobecny</td></tr>
      <tr data-code="7778886663" data-row="C" data-seat="7"><td>7778886663</td><td>Rząd C, Miejsce 7</td><td class="status">Nieobecny</td></tr>
      <tr data-code="7778886664" data-row="D" data-seat="10"><td>7778886664</td><td>Rząd D, Miejsce 10</td><td class="status">Nieobecny</td></tr>
      <tr data-code="7778886665" data-row="A" data-seat="13"><td>7778886665</td><td>Rząd A, Miejsce 13</td><td class="status">Nieobecny</td></tr>
      <tr data-code="7778886666" data-row="B" data-seat="6"><td>7778886666</td><td>Rząd B, Miejsce 6</td><td class="status">Nieobecny</td></tr>
    </tbody>
  </table>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB0H-yDGiUmr_dEW9SF6u4CvFsK_K627zw",
      authDomain: "aplikacja-bilety.firebaseapp.com",
      databaseURL: "https://aplikacja-bilety-default-rtdb.firebaseio.com/",
      projectId: "aplikacja-bilety",
      storageBucket: "aplikacja-bilety.firebasestorage.app",
      messagingSenderId: "230436720725",
      appId: "1:230436720725:web:324a39f8b2a0c7104244dc"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const attendeeList = document.getElementById('attendeeList');

    // Synchronizuj status obecności z Firebase
    firebase.database().ref("attendees").on("value", snapshot => {
      const data = snapshot.val();
      if (!data) return;
      document.querySelectorAll('#attendeeList tr').forEach(row => {
        const code = row.dataset.code;
        const statusCell = row.querySelector('.status');
        if (data[code]) {
          row.classList.add('checked');
          statusCell.textContent = 'Obecny';
        } else {
          row.classList.remove('checked');
          statusCell.textContent = 'Nieobecny';
        }
      });
    });

    function checkIn() {
      const input = document.getElementById('codeInput').value.trim().toUpperCase();
      let matched = false;

      // Sprawdzenie kodu biletu
      const row = document.querySelector(`#attendeeList tr[data-code='${input}']`);
      if (row) {
        if (!row.classList.contains('checked')) {
          firebase.database().ref("attendees/" + input).set(true);
          matched = true;
        } else {
          alert('To miejsce zostało już oznaczone jako obecne.');
        }
      }

      // Sprawdzenie numeru rzędu i miejsca (np. A-18)
      if (!matched) {
        const [rowLetter, seatNumber] = input.split('-');
        const rowsInSameRow = document.querySelectorAll(`#attendeeList tr[data-row='${rowLetter.toUpperCase()}'][data-seat='${seatNumber}']`);
        if (rowsInSameRow.length > 0) {
          rowsInSameRow.forEach(row => {
            if (!row.classList.contains('checked')) {
              firebase.database().ref("attendees/" + row.dataset.code).set(true);
            }
          });
          matched = true;
        }
      }

      if (!matched) {
        alert('Nie znaleziono takiego biletu lub miejsca.');
      }

      document.getElementById('codeInput').value = '';
    }
  </script>
</body>
</html>
